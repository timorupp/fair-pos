services:

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend: Fastify API + SvelteKit SPA (static files) + Print Worker
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Swissbit USB-TSE: no separate service/middleware container — the backend
    # process calls a small CLI (packages/backend/native/tse-cli) that talks to
    # the TSE directly as a mounted filesystem. See docs/TSE-Integration.md.
    # Uncomment and adjust the host-side mount point once the TSE is plugged
    # in; TSE_MOUNT_POINT in .env must then point at the container-side path
    # (the right-hand side below).
    # volumes:
    #   - /mnt/tse-usb:/mnt/tse-usb:rw

volumes:
  # Named volume so PostgreSQL data lives inside the WSL2 VM (Linux permissions required).
  postgres_data:

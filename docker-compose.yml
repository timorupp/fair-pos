# Local development only — PostgreSQL for `npm run dev`.
#
# The application itself (backend + frontend) is NOT containerized, in
# development or production: `npm run dev` runs it directly on the host, and
# production is a native Ubuntu installation (see docs/SETUP.md →
# "Production-Deployment"). The Swissbit USB-TSE is a mounted filesystem the
# backend process reads directly (see docs/TSE-Integration.md) — running the
# app in a container would mean dealing with Docker bind-mount propagation
# for hot-plugged USB hardware for no real benefit on a single dedicated
# server, so this project deliberately doesn't containerize it at all.
#
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Named volume so PostgreSQL data lives inside the WSL2 VM (Linux permissions required).
  postgres_data:
